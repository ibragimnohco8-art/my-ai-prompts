<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>AI Prompts</title>
</head>
<body style="background:#111;color:white;font-family:Arial;padding:40px;">

<h1>AI Prompts</h1>
<div id="prompts"></div>

<script>
const SUPABASE_URL = "https://bowqcdysazxnxgocblcg.supabase.co"
const SUPABASE_KEY = "sb_publishable_ncGsDuY6YOsvkMmJC9Iqcw_j32r_GZP"

async function loadPrompts() {
  const res = await fetch(
    `${SUPABASE_URL}/rest/v1/prompts?select=*`,
    {
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: `Bearer ${SUPABASE_KEY}`
      }
    }
  )

  const data = await res.json()
  console.log("DATA:", data)

  const container = document.getElementById("prompts")

  if (!Array.isArray(data)) {
    container.innerHTML = "<p>Ошибка загрузки данных</p>"
    return
  }

  data.forEach(p => {
    container.innerHTML += `
      <div style="margin-bottom:30px;border-bottom:1px solid #333;padding-bottom:20px;">
        <h3>${p.title}</h3>
        <p>${p.text}</p>
        <small>${p.category}</small>
      </div>
    `
  })
}

loadPrompts()
</script>

</body>
</html>
